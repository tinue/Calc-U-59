name: Build site

# This workflow lives on the gh-pages branch, not on main.
#
# gh-pages is a standalone, orphan-style branch whose root *is* the website:
# what the main repository checks out into docs/ (as a git worktree) is this
# branch's top level. So there is no docs/ prefix here, and a workflow on main
# would never see these files.
#
# GitHub Actions reads workflow files from the branch that was pushed, which is
# what makes this work: pushing to gh-pages runs the copy of this file that is
# on gh-pages.
#
# Purpose: docs/build/ and every prerendered index.html are generated by
# .seo/build.js. The failure mode worth guarding is a .jsx edit committed
# without a rebuild, leaving the published HTML showing stale text. This
# rebuilds on every push and commits the result if it differs.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: two overlapping runs would both try to push a rebuild to
# the same branch and the loser would fail on a non-fast-forward.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          # Keep the token so the commit step can push back.
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies, no npm install: React, Babel and the server renderer
      # are vendored in vendor/ and .seo/vendor/.
      - name: Build
        run: node .seo/build.js

      # jsdom is only needed for check.js's client-boot section. It is
      # gitignored (along with package.json / package-lock.json), so it cannot
      # dirty the commit below.
      - name: Check
        run: |
          npm install --no-save jsdom
          node .seo/check.js

      - name: Commit if the output changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Build output already current — nothing to commit."
            exit 0
          fi
          git diff --staged --name-only
          git commit -m "Rebuild static site"
          # A push made with GITHUB_TOKEN does not trigger workflows, so this
          # cannot re-enter this workflow. It does still trigger the Pages
          # deployment, which is the point.
          git push origin HEAD:gh-pages
