<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc-U 59 — web client</title>
<!-- The web client's demo and test page: PlayCalculator with the physical
     keyboard, in the layout the query names (?layout=wide|portrait, default
     wide; also ?width=, ?height=, ?model=, ?module=, ?preset=). Every path
     is relative, like the rest of dist/ (reference/WebClient.md). -->
<link rel="stylesheet" href="calc.css">
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 13px -apple-system, "Segoe UI", sans-serif; }
  main { padding: 16px; }
  nav { margin-bottom: 12px; }
  nav a { color: #0a84ff; margin-right: 12px; }
  #root { max-width: 1400px; }
  body.portrait #root { max-width: 400px; }
</style>
</head>
<body>
<main>
  <nav><a href="?layout=wide">Wide</a><a href="?layout=portrait">Portrait</a><a href="app/">App</a></nav>
  <div id="root"></div>
</main>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="calc.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const layout = q.get("layout") === "portrait" ? "portrait" : "wide";
  document.body.classList.toggle("portrait", layout === "portrait");
  const num = (k) => (q.get(k) ? Number(q.get(k)) : undefined);
  ReactDOM.createRoot(document.getElementById("root")).render(
    React.createElement(PlayCalculator, {
      layout, keyboard: true, width: num("width"), height: num("height"),
      model: q.get("model") || undefined, module: q.get("module") || undefined, preset: q.get("preset") || undefined,
    }));
</script>
</body>
</html>
