<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calc-U 59 — User Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/app-icon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="Calculator.jsx"></script>
<script src="cuecard-data.js"></script>
<script type="text/babel" src="cuecard.jsx"></script>
<script type="text/babel" src="PlayCalculator.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>

<script type="text/babel">
  const VALID_PAGES = new Set([
    "home","start","install-mobile","install-mac",
    "state-files","debugger","ref","modules","faq","play"
  ]);
  const VALID_TOPICS = new Set([
    "install-mobile","install-mac","state-files",
    "debugger","printer","faq","readme"
  ]);

  function parseHash(hash) {
    const raw = hash.replace(/^#/, "");
    const [pageRaw, topicRaw] = raw.split("/");
    const page = VALID_PAGES.has(pageRaw) ? pageRaw : "home";
    const topic = (page === "start" && VALID_TOPICS.has(topicRaw))
      ? topicRaw : "install-mobile";
    return { page, topic };
  }

  function useHashNav() {
    const [nav, setNav] = React.useState(() => parseHash(window.location.hash));
    React.useEffect(() => {
      // Normalize empty hash to #home on initial load
      if (!window.location.hash) {
        window.location.hash = "#home";
      }
    }, []);
    React.useEffect(() => {
      function onHashChange() {
        setNav(parseHash(window.location.hash));
        window.scrollTo(0, 0);
      }
      window.addEventListener("hashchange", onHashChange);
      return () => window.removeEventListener("hashchange", onHashChange);
    }, []);
    function onNav(target) {
      window.location.hash = typeof target === "string"
        ? "#" + target
        : "#" + target.page + (target.topic ? "/" + target.topic : "");
    }
    return { page: nav.page, topic: nav.topic, onNav };
  }

  function App() {
    const { page, topic, onNav } = useHashNav();
    return (
      <>
        <SiteHeader page={page} />
        {page === "home"           && <HomePage onNav={onNav} />}
        {page === "start"          && <GettingStartedPage initialTopic={topic} onNav={onNav} />}
        {page === "play"           && <PlayPage onNav={onNav} />}
        {page === "install-mobile" && <InstallMobilePage onNav={onNav} />}
        {page === "install-mac"    && <InstallMacPage onNav={onNav} />}
        {page === "state-files"    && <StateFilesPage onNav={onNav} />}
        {page === "debugger"       && <DebuggerPage onNav={onNav} />}
        {page === "ref"            && <ReferencePage onNav={onNav} />}
        {page === "modules"        && <ModulesPage onNav={onNav} />}
        {page === "faq"            && <FaqPage onNav={onNav} />}
        <SiteFooter />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
