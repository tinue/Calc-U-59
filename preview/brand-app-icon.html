<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — App icon</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:18px 22px;display:flex;align-items:center;gap:24px;justify-content:center;}
  .row{display:flex;align-items:center;gap:24px;}
  .ico{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .ico img{display:block;border-radius:var(--r);}
  .ico .cap{font-family:var(--font-mono);font-size:10px;color:#7a6a55;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="row">
    <div class="ico" style="--r:14px"><img src="../assets/app-icon.png" width="64" height="64" alt=""><span class="cap">64 · 14r</span></div>
    <div class="ico" style="--r:18px"><img src="../assets/app-icon.png" width="84" height="84" alt=""><span class="cap">84 · 18r</span></div>
    <div class="ico" style="--r:24px"><img src="../assets/app-icon.png" width="120" height="120" alt=""><span class="cap">120 · 24r</span></div>
    <div class="ico" style="--r:32px"><img src="../assets/app-icon.png" width="160" height="160" alt=""><span class="cap">160 · 32r</span></div>
  </div>
</div>
</body></html>
