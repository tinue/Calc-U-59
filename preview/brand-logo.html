<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:22px 24px;display:flex;align-items:center;gap:28px;}
  img{width:64px;height:64px;border-radius:14px;display:block;}
  .wm{display:flex;flex-direction:column;line-height:1;}
  .wm .top{font-family:var(--font-key);font-weight:700;font-size:34px;letter-spacing:.04em;text-transform:uppercase;color:#efe4cc;}
  .wm .top em{font-style:normal;color:#f0c040;}
  .wm .sub{font-family:var(--font-key);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#7a6a55;margin-top:8px;}
</style></head>
<body class="calcu">
<div class="card">
  <img src="../assets/app-icon.png" alt="Calc-U 59 icon">
  <div class="wm">
    <span class="top">Calc-U <em>59</em></span>
    <span class="sub">TI-59 emulator · User guide</span>
  </div>
</div>
</body></html>
