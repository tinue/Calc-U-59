<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Brand palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:18px 20px;}
  .row{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;}
  .sw{aspect-ratio:1/1.05;border-radius:8px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 9px;font-size:10px;letter-spacing:.04em;border:1px solid rgba(255,200,100,.08);}
  .sw b{display:block;font-family:var(--font-key);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
  .sw small{opacity:.85;font-family:var(--font-mono);font-size:9px;display:block;}
  .sw.lt{color:#1a130d;}
  .sw.dk{color:#efe4cc;}
  .eyebrow{font-family:var(--font-key);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b88a20;margin:0 0 10px;}
</style></head>
<body class="calcu">
<div class="card">
  <p class="eyebrow">Brand palette · from the iOS app</p>
  <div class="row">
    <div class="sw dk" style="background:#000000;border-color:#3a2a1c"><b>BG Black</b><small>#000000</small></div>
    <div class="sw dk" style="background:#2a1f15"><b>Key Dark</b><small>#2A1F15</small></div>
    <div class="sw dk" style="background:#2c1812"><b>Mahogany</b><small>#2C1812</small></div>
    <div class="sw dk" style="background:#ff2614;color:#fff;text-shadow:0 0 6px rgba(255,38,20,.6)"><b>LED Red</b><small>#FF2614</small></div>
    <div class="sw lt" style="background:#efe4cc"><b>Key Cream</b><small>#EFE4CC</small></div>
    <div class="sw lt" style="background:#f0c040"><b>Accent</b><small>#F0C040</small></div>
    <div class="sw lt" style="background:#d8a830"><b>Accent 2</b><small>#D8A830</small></div>
    <div class="sw dk" style="background:#0a84ff;color:#fff"><b>iOS Blue</b><small>#0A84FF</small></div>
  </div>
</div>
</body></html>
