<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Semantic surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:18px 20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .pair{border-radius:8px;overflow:hidden;border:1px solid #2a1f15;}
  .pair .top{height:62px;display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--font-key);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px;}
  .pair .bot{padding:6px 10px;font-family:var(--font-mono);font-size:10px;color:#7a6a55;background:#0a0806;border-top:1px solid #2a1f15;}
  .eyebrow{font-family:var(--font-key);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b88a20;margin:0 0 10px;}
</style></head>
<body class="calcu">
<div class="card">
  <p class="eyebrow">Semantic surfaces</p>
  <div class="grid">
    <div class="pair"><div class="top" style="background:#000;color:#efe4cc">Page bg</div><div class="bot">--bg · #000</div></div>
    <div class="pair"><div class="top" style="background:#14100c;color:#efe4cc">Elevated</div><div class="bot">--bg-elevated</div></div>
    <div class="pair"><div class="top" style="background:#1a130d;color:#efe4cc">Inset / code</div><div class="bot">--bg-inset</div></div>
    <div class="pair"><div class="top" style="background:#2c1812;color:#c89858">Display bezel</div><div class="bot">--bg-display-bezel</div></div>
    <div class="pair"><div class="top" style="background:#1a0606;color:#ff2614;font-family:var(--font-display)">8 8 8 8</div><div class="bot">--bg-display + LED</div></div>
    <div class="pair"><div class="top" style="background:#f0c040;color:#2a1f10">Accent</div><div class="bot">--accent · #F0C040</div></div>
    <div class="pair"><div class="top" style="background:#efe4cc;color:#1a130d">Key cream</div><div class="bot">--key-cream</div></div>
    <div class="pair"><div class="top" style="background:#2a1f15;color:#efe4cc">Key dark</div><div class="bot">--key-dark</div></div>
  </div>
</div>
</body></html>
