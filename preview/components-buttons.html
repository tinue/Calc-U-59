<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:20px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-key);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;padding:10px 18px;border-radius:6px;border:0;cursor:pointer;}
  .btn.primary{background:linear-gradient(180deg,#f0c040,#d8a830);color:#2a1f10;box-shadow:0 1px 0 #b88a20,0 2px 4px rgba(0,0,0,.5);}
  .btn.secondary{background:#14100c;color:#efe4cc;border:1px solid #3a2a1c;}
  .btn.ghost{background:transparent;color:#0a84ff;border:1px solid transparent;}
  .btn.ghost:hover{background:rgba(10,132,255,.08);}
  .btn small{font-family:var(--font-mono);font-size:10px;opacity:.7;font-weight:500;letter-spacing:0;text-transform:none;}
</style></head>
<body class="calcu">
<div class="card">
  <button class="btn primary">App Store <small>↗</small></button>
  <button class="btn secondary">View on GitHub</button>
  <button class="btn ghost">Release notes</button>
</div>
</body></html>
