<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Cards & callouts</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .panel{background:#14100c;border:1px solid #2a1f15;border-radius:10px;padding:14px 16px;box-shadow:0 1px 0 #1a130d, 0 4px 16px rgba(0,0,0,.4);}
  .panel .eyebrow{font-family:var(--font-key);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7a6a55;margin:0 0 4px;}
  .panel h3{font-family:var(--font-key);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px;color:#efe4cc;}
  .panel p{font-size:13px;margin:0;color:#b8a880;line-height:1.5;}
  .callout{background:rgba(240,192,64,.06);border-left:2px solid #f0c040;border-radius:0 6px 6px 0;padding:12px 14px;}
  .callout .eyebrow{color:#f0c040;}
  .keystroke{display:inline-flex;gap:4px;font-family:var(--font-mono);font-size:11px;}
  .keystroke b{display:inline-block;background:#2a1f15;color:#efe4cc;padding:1px 6px;border-radius:3px;font-weight:600;}
  .keystroke b.cream{background:#efe4cc;color:#1a130d;}
  .keystroke b.yellow{background:#f0c040;color:#2a1f10;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="panel">
    <p class="eyebrow">Module info</p>
    <h3>Switching libraries</h3>
    <p>Tap the <span class="keystroke"><b style="background:transparent;color:#0a84ff">TI-59</b></span> picker in the bottom toolbar to load another module.</p>
  </div>
  <div class="panel callout">
    <p class="eyebrow">Note</p>
    <h3>Programs sync via iCloud</h3>
    <p>Anything saved on Mac appears on your iPhone within seconds. No account setup needed.</p>
  </div>
</div>
</body></html>
