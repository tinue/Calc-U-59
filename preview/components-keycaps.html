<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Keycaps</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:20px 22px;display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .group{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .label-top{font-family:var(--font-key);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#d4c4a0;height:14px;}
  .label-top.it{font-style:italic;font-family:var(--font-body);text-transform:none;}
  .key{width:56px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-key);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;border-radius:7px;user-select:none;}
  .key.cream{background:linear-gradient(180deg,#efe4cc,#d8c8a8);color:#1a130d;border-radius:6px;box-shadow:0 1px 0 #6a5a3c,0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);}
  .key.dark{background:linear-gradient(180deg,#2a1f15,#1f1610);color:#efe4cc;box-shadow:0 1px 0 #000,0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,200,100,.05);}
  .key.yellow{background:linear-gradient(180deg,#f0c040,#d8a830);color:#2a1f10;box-shadow:0 1px 0 #5a3c10,0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);}
  .key.pressed{box-shadow:inset 0 2px 4px rgba(0,0,0,.6);transform:translateY(1px);}
  .cap{font-family:var(--font-mono);font-size:10px;color:#7a6a55;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="group"><span class="label-top">A'</span><div class="key dark">A</div><span class="cap">.dark</span></div>
  <div class="group"><span class="label-top">&nbsp;</span><div class="key yellow">2nd</div><span class="cap">.yellow</span></div>
  <div class="group"><span class="label-top">log</span><div class="key dark">lnx</div><span class="cap">w/ top</span></div>
  <div class="group"><span class="label-top it">x=t</span><div class="key cream">7</div><span class="cap">.cream</span></div>
  <div class="group"><span class="label-top">Deg</span><div class="key yellow">÷</div><span class="cap">op</span></div>
  <div class="group"><span class="label-top">Pause</span><div class="key dark pressed">GTO</div><span class="cap">:pressed</span></div>
</div>
</body></html>
