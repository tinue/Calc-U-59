<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:24px 22px;display:flex;gap:20px;justify-content:space-around;align-items:center;flex-wrap:wrap;}
  .e{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .blk{width:96px;height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-key);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;}
  .blk.key-dark{background:linear-gradient(180deg,#2a1f15,#1f1610);color:#efe4cc;box-shadow:0 1px 0 #000,0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,200,100,.05);}
  .blk.key-cream{background:linear-gradient(180deg,#efe4cc,#d8c8a8);color:#1a130d;box-shadow:0 1px 0 #6a5a3c,0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);}
  .blk.key-yellow{background:linear-gradient(180deg,#f0c040,#d8a830);color:#2a1f10;box-shadow:0 1px 0 #5a3c10,0 2px 3px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);}
  .blk.pressed{background:linear-gradient(180deg,#1a1208,#100a04);color:#b8a880;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);}
  .blk.inset{background:#0a0302;color:#ff2614;font-family:var(--font-display);text-shadow:0 0 8px rgba(255,38,20,.6);box-shadow:inset 0 2px 8px rgba(0,0,0,.8);border-radius:4px;}
  .cap{font-family:var(--font-mono);font-size:10px;color:#7a6a55;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="e"><div class="blk key-dark">Dark</div><span class="cap">--shadow-key</span></div>
  <div class="e"><div class="blk key-cream">Cream</div><span class="cap">--shadow-key-cream</span></div>
  <div class="e"><div class="blk key-yellow">Yellow</div><span class="cap">--shadow-key-yellow</span></div>
  <div class="e"><div class="blk pressed">Pressed</div><span class="cap">--shadow-key-pressed</span></div>
  <div class="e"><div class="blk inset">8.8.8</div><span class="cap">--shadow-display-inset</span></div>
</div>
</body></html>
