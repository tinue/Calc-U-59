<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Spacing & radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:18px 22px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;}
  .col h4{font-family:var(--font-key);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a6a55;margin:0 0 8px;}
  .stack{display:flex;align-items:flex-end;gap:8px;}
  .bar{background:linear-gradient(180deg,#f0c040,#d8a830);box-shadow:0 1px 0 #b88a20;border-radius:3px;width:18px;display:flex;align-items:flex-end;justify-content:center;color:#2a1f10;font-family:var(--font-mono);font-size:9px;font-weight:600;padding-bottom:2px;}
  .radii{display:flex;gap:14px;align-items:center;}
  .ra{width:48px;height:48px;background:#14100c;border:1px solid #3a2a1c;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:#b8a880;text-align:center;line-height:1.2;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="col">
    <h4>Spacing scale · 4 → 64</h4>
    <div class="stack">
      <div class="bar" style="height:8px">4</div>
      <div class="bar" style="height:16px">8</div>
      <div class="bar" style="height:24px">12</div>
      <div class="bar" style="height:32px">16</div>
      <div class="bar" style="height:48px">24</div>
      <div class="bar" style="height:64px">32</div>
      <div class="bar" style="height:80px">48</div>
      <div class="bar" style="height:96px">64</div>
    </div>
  </div>
  <div class="col">
    <h4>Radii · soft, not pill</h4>
    <div class="radii">
      <div class="ra" style="border-radius:6px">6<br>cream</div>
      <div class="ra" style="border-radius:7px">7<br>key</div>
      <div class="ra" style="border-radius:10px">10<br>card / display</div>
    </div>
  </div>
</div>
</body></html>
