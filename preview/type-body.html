<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Body & inline</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#efe4cc;}
  .card{font-family:var(--font-body);padding:20px 22px;}
  .eyebrow{font-family:var(--font-key);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f0c040;margin:0 0 6px;}
  p{margin:0 0 8px;font-size:16px;line-height:1.55;color:#b8a880;max-width:62ch;}
  small{font-size:14px;color:#b8a880;}
  kbd{font-family:var(--font-mono);font-size:13px;background:#1a130d;color:#efe4cc;padding:2px 7px;border-radius:4px;border:1px solid #3a2a1c;}
  code{font-family:var(--font-mono);font-size:13px;background:#1a130d;color:#d4c4a0;padding:1px 6px;border-radius:3px;border:1px solid #2a1f15;}
  a{color:#0a84ff;text-decoration:none;}
</style></head>
<body class="calcu">
<div class="card">
  <p class="eyebrow">Body · 16/24 · IBM Plex Sans</p>
  <p>Calc-U 59 is a TI-59 emulator for Mac, iPhone, and iPad. Programs sync via iCloud; modules are switched from the <kbd>TI-59</kbd> picker in the bottom toolbar.</p>
  <p><small>Caption · 14/20 — Program files live at <code>~/Library/Calc-U-59/Programs/</code>. See <a href="#">iCloud sync</a> for details.</small></p>
</div>
</body></html>
