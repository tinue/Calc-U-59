<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#efe4cc;}
  .card{font-family:var(--font-body);padding:20px 22px;}
  .row{display:grid;grid-template-columns:60px 1fr 110px;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dashed #2a1f15;}
  .row:last-child{border:0;}
  .size{font-family:var(--font-mono);font-size:11px;color:#7a6a55;}
  .spec{font-family:var(--font-key);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7a6a55;text-align:right;}
  .h1{font-family:var(--font-key);font-weight:700;font-size:44px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05;}
  .h1 em{font-style:normal;color:#f0c040;}
  .h2{font-family:var(--font-key);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;}
  .h3{font-family:var(--font-key);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;}
  .h4{font-family:var(--font-body);font-weight:700;font-size:17px;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="row"><span class="size">44/48</span><span class="h1">Calc-U <em>59</em></span><span class="spec">H1 · Barlow Cd</span></div>
  <div class="row"><span class="size">30/38</span><span class="h2">Master Library</span><span class="spec">H2 · Barlow Cd</span></div>
  <div class="row"><span class="size">22/28</span><span class="h3">Loading a module</span><span class="spec">H3 · Barlow Cd</span></div>
  <div class="row"><span class="size">17/24</span><span class="h4">Bottom toolbar</span><span class="spec">H4 · IBM Plex</span></div>
</div>
</body></html>
