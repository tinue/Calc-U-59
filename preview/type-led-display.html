<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Calc-U 59 — LED display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;}
  .card{font-family:var(--font-body);padding:18px 22px;}
  .display{background:linear-gradient(180deg,#1a0c08 0%,#2c1812 50%,#1a0c08 100%);padding:14px 14px 10px;border-radius:10px;border:1px solid #3a2418;}
  .led-window{background:#0a0302;border-radius:4px;padding:10px 14px 6px;text-align:right;box-shadow:inset 0 2px 8px rgba(0,0,0,.8);position:relative;overflow:hidden;}
  .led-ghost{position:absolute;inset:10px 14px 6px;text-align:right;font-family:var(--font-display);font-size:32px;color:#3a0e08;letter-spacing:.04em;line-height:1;}
  .led{font-family:var(--font-display);font-size:32px;color:#ff2614;text-shadow:0 0 10px rgba(255,38,20,.7),0 0 22px rgba(255,38,20,.3);letter-spacing:.04em;line-height:1;position:relative;}
  .watermark{display:flex;justify-content:space-between;margin-top:6px;color:#5a3018;font-family:var(--font-key);font-size:9px;letter-spacing:.12em;text-transform:uppercase;}
  .module{display:flex;justify-content:space-between;padding:8px 2px 0;color:#c89858;font-family:var(--font-key);font-weight:700;font-size:11px;letter-spacing:.05em;}
</style></head>
<body class="calcu">
<div class="card">
  <div class="display">
    <div class="led-window">
      <div class="led-ghost">~8.8.8.8.8.8.8.8-8.8.</div>
      <div class="led">-1,234567 8-90</div>
      <div class="watermark"><span>Solid State Software</span><span>TI ©1977</span></div>
    </div>
    <div class="module"><span>MASTER LIBRARY DIAGNOSTIC</span><span>ML-01</span></div>
  </div>
</div>
</body></html>
